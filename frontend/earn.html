<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiếm Điểm Đổi File</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <h2>Nhiệm Vụ Kiếm Điểm</h2>
    <div class="earn-tabs">
      <button class="tab-btn active" onclick="showTab('bypass')">1. Vượt Link</button>
      <button class="tab-btn" onclick="showTab('video')">2. Đăng Video TikTok/YouTube</button>
    </div>

    <!-- Tab 1: Vượt link -->
    <div id="tab-bypass" class="tab-content" style="display: block; margin-top: 20px;">
      <p>Vượt liên kết rút gọn để nhận ngay <strong>+400 điểm</strong>.</p>
      <button id="btn-get-link" class="btn-primary" onclick="generateLink()">Lấy Link Vượt Ngay</button>
      <div id="link-result" style="margin-top: 15px;"></div>
    </div>

    <!-- Tab 2: Video -->
    <div id="tab-video" class="tab-content" style="display: none; margin-top: 20px;">
      <p>Đăng video hướng dẫn lên TikTok/YouTube để nhận điểm thưởng theo mốc view.</p>
      <input type="text" id="video-url" placeholder="Dán link video TikTok / YouTube vào đây..." style="width: 100%; padding: 10px; margin-bottom: 10px;">
      <select id="video-milestone" style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <option value="1000">Mốc 1,000 Views</option>
        <option value="3000">Mốc 3,000 Views</option>
        <option value="5000">Mốc 5,000 Views</option>
        <option value="10000">Mốc 10,000 Views</option>
      </select>
      <button class="btn-primary" onclick="alert('Đã gửi video lên hệ thống, admin sẽ duyệt trong 24h!')">Gửi Duyệt Video</button>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    function showTab(type) {
      document.getElementById('tab-bypass').style.display = type === 'bypass' ? 'block' : 'none';
      document.getElementById('tab-video').style.display = type === 'video' ? 'block' : 'none';
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    async function generateLink() {
      const btn = document.getElementById('btn-get-link');
      btn.innerText = "Đang tạo link...";
      try {
        const res = await fetch(`${window.APP_CONFIG.API_BASE_URL}/api/bypass/link4m`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: "guest", targetUrl: window.location.href })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('link-result').innerHTML = `<a href="${data.shortUrl}" target="_blank" class="btn-link">Bấm vào đây để bắt đầu vượt link</a>`;
        } else {
          alert(data.message || "Lỗi tạo link");
        }
      } catch (e) {
        alert("Không thể kết nối Worker backend.");
      } finally {
        btn.innerText = "Lấy Link Vượt Ngay";
      }
    }
  </script>
</body>
</html>
